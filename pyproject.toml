[project]
name = "partspec"
version = "0.6.0"
description = "Verify CAD-as-code parts against declared engineering intent."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Cameron Brooks" }]
keywords = ["cad", "openscad", "build123d", "cadquery", "verification"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Manufacturing",
    "Topic :: Scientific/Engineering",
]

# Intentionally empty. Importing `partspec` MUST NOT pull in a CAD engine
# (SPEC-contract.md 1.1). Engines are extras; the core is stdlib-only, which
# keeps the parameter phase and `--list` fast and makes the rule structural
# rather than a convention someone has to remember.
dependencies = []

[project.optional-dependencies]
# OpenSCAD parts. The `openscad` binary itself is a system dependency.
mesh = ["trimesh>=5.0", "manifold3d>=3.5"]
# build123d parts. Pins the OCP provider explicitly — see AGENTS.md.
occt = ["build123d>=0.11,<0.12"]
# CadQuery parts, adopted into the OCCT backend via `.wrapped`.
#
# Pulls build123d too: `backends/occt.py` measures through build123d's Shape
# API, so the CadQuery tier does not work without it -- the extra used to
# install a tier that could not run. `cadquery-ocp` is named explicitly because
# it is the VTK-enabled superset both engines can share; see [tool.uv] below for
# why that matters and `partspec.engines.pycad` for what happens when the
# environment gets it wrong anyway.
cadquery = ["cadquery>=2.8,<3", "build123d>=0.11,<0.12", "cadquery-ocp>=7.8"]
# The MCP adapter (D18): stateless tools over check/measure/render, stdio transport.
# Not an engine — pairs with whichever engine extras the parts need.
mcp = ["mcp>=2,<3"]

[project.scripts]
partspec = "partspec.cli:main"
partspec-mcp = "partspec.mcp:main"

[project.urls]
Repository = "https://github.com/CameronBrooks11/partspec"
Issues = "https://github.com/CameronBrooks11/partspec/issues"
Changelog = "https://github.com/CameronBrooks11/partspec/blob/main/CHANGELOG.md"
Documentation = "https://github.com/CameronBrooks11/partspec/tree/main/docs"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The sdist shipped everything not gitignored, and `uv.lock` alone was 27% of
# it — half a megabyte a consumer cannot use, since it pins this repo's dev
# environment and not the package's requirements.
#
# What is NOT excluded is the more considered half. `tests/` ships because a
# downstream packager runs the suite from an sdist, and that claim only holds
# if the suite actually passes there — so everything the suite reads ships
# too: `docs/`, `examples/`, `skills/`, `evals/`, `notes/` and `.github/`.
# The first draft of this list cut the last three and broke five tests in the
# sdist, which is the same failure this slice exists to fix: a promise made
# in prose and enforced by nothing. `test_the_sdist_carries_everything_the
# _suite_reads` enforces it now.
#
# The wheel needs no such list: it was already exactly the package.
[tool.hatch.build.targets.sdist]
exclude = [
  "uv.lock",
  "CLAUDE.md",
  ".pre-commit-config.yaml",
  ".editorconfig",
]

[tool.uv]
# THE OCP LANDMINE, and the fix.
#
# build123d depends on `cadquery-ocp-novtk`; CadQuery depends on `cadquery-ocp`.
# Both wheels install the SAME top-level `OCP/` package (326 vs 322 files) and
# neither pip nor uv detects the conflict — whichever lands last wins. When
# novtk wins, `OCP.IVtkOCC` loses its VTK bindings and **CadQuery cannot even
# import**, which is a hard failure with no warning anywhere.
#
# Measured here: a plain `uv sync --all-extras` produced exactly that, and
# `import cadquery` died with
#   ImportError: cannot import name 'IVtkOCC_Shape' from 'OCP.IVtkOCC'
#
# The marker below never matches, which drops novtk from resolution entirely and
# leaves the VTK-enabled `cadquery-ocp` as the sole provider. It is a superset,
# so build123d is unaffected. PartCAD solves the same problem by re-asserting
# the VTK build last in its sandbox setup; this is the declarative equivalent.
#
# `just ocp-guard` asserts the outcome, because the failure is silent.
override-dependencies = ["cadquery-ocp-novtk ; sys_platform == 'never'"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff==0.16.*",  # pinned with .pre-commit-config.yaml — see the note there
    "pyright>=1.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# Markdown is documentation, not source. Ruff 0.16 formats fenced Python blocks,
# which rewrites the deliberately-aligned illustrative snippets in docs/ (the
# Protocol stubs, the `openscad(path, **params)  # ...` comment column). The
# specs are normative prose and a formatter should not own their layout.
# notes/ is archival analysis and the as-filed tracker scripts (#51) — their
# value is provenance, and a formatter rewriting provenance owns nothing.
extend-exclude = ["*.md", "notes"]
# Bind the exclusion even for explicitly-passed paths (`ruff check notes/`):
force-exclude = true

[tool.ruff.lint]
# Measured before adopting, each with `--extend-select` on top of the base set.
#
# `C4`, `S102` and `S307` cost ZERO violations today. The last two matter more
# than that sounds: this repo carries five `# noqa: S102`/`S307` comments over
# the places it executes user-supplied CAD-as-code, and they suppressed rules
# nobody had enabled — a hazard marked "reviewed and waived" with no reviewer.
# Enabling them turns five decorative comments into enforced ones.
#
# `BLE` costs 2 and makes the ten existing `noqa: BLE001` annotations true for
# the same reason. `PTH` costs 4. `PT` costs 88, of which 86 are `PT018`
# (composite `assert a and b`) — high churn, taste-dependent, and an unsafe
# autofix across 86 test assertions is not a diff worth reviewing, so it is
# ignored and the remaining 2 adopted. `RUF` costs 47, of which 6 are `RUF002`
# (ambiguous unicode in a docstring) — this repo writes em-dashes deliberately
# throughout its prose, and that rule fights the house voice.
#
# `ARG` (55, of which 41 in tests) is deliberately NOT adopted: an unused
# fixture argument is the normal shape of a pytest test, and the eight real
# ones were found by walking the AST instead.
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "PTH", "PT", "RUF", "BLE", "S102", "S307"]
ignore = ["PT018", "RUF002"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
include = ["src", "tests", "examples", "evals", "scripts"]
# `examples/` in particular: it is user-facing teaching material, and an example
# that would not type-check is a worse lesson than one that would. `evals/` and
# `scripts/` were linted by ruff and never type-checked; both were already
# clean, so including them costs nothing and stops the drift.

[tool.pytest.ini_options]
testpaths = ["tests"]
