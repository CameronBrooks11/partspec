# Dependabot — because nothing else was going to tell us.
#
# Every action in this repo drifted three majors behind before anyone noticed
# (#171), and the only signal was a Node 20 deprecation warning buried in the
# log of a green job. Six actions, all still on node20. A weekly PR is the
# cheap fix; the `ok` gate decides whether each one is safe, which is what it
# is for.
#
# Grouped rather than one PR per dependency: a batch that CI has run as a
# batch is the thing being merged, and six separate green PRs do not prove the
# six work together.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"

  # `uv`, not `pip`: the lockfile is committed (see AGENTS.md — it is what
  # holds the single-OCP-provider resolution in place), so the lock is the
  # thing that needs updating and `uv lock` is what updates it honestly.
  #
  # The OCP hazard is covered rather than trusted: `just ocp-guard` runs in the
  # `check` job, so a resolution that lands two providers fails the gate on the
  # Dependabot PR instead of on someone's machine.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python:
        patterns: ["*"]
    commit-message:
      prefix: "build"
    # ruff is pinned TWICE — the dev group here and `.pre-commit-config.yaml`'s
    # rev — and `test_both_ruff_pins_name_one_version` requires them equal,
    # because the hooks mutate (`--fix`, `ruff-format`) and a split means
    # `git commit` writes a diff `just check` then rejects.
    #
    # Dependabot cannot bump both in one PR: they are different ecosystems, and
    # groups do not span ecosystems. Its first attempt (#174) bumped this half
    # alone and the gate refused it, correctly and immediately. Left to itself
    # that repeats every ruff release, so ruff is a deliberate two-file manual
    # bump and both ecosystems ignore it. The guard is what makes that safe:
    # forgetting the second file fails, it does not drift.
    ignore:
      - dependency-name: "ruff"

  # The hook pins rot exactly like the action pins did (#171) — `gitleaks` and
  # `pre-commit-hooks` are third-party revs nothing was watching either.
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      hooks:
        patterns: ["*"]
    commit-message:
      prefix: "chore"
    ignore:
      - dependency-name: "astral-sh/ruff-pre-commit"
