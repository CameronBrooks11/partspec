# CI with unified "ok" gate for branch protection.
#
# The only required status check is `ok` (bare job name, not "CI / ok").
# Add jobs to its `needs:` list rather than to branch protection directly.
#
# Path filtering uses dorny/paths-filter rather than paths-ignore on the trigger,
# so the workflow always runs and `ok` always reports a status — including on
# docs-only PRs, which matters here because the specs in docs/ are load-bearing
# and a docs change must not silently skip the gate.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Declared rather than inherited. The repo default is already read-only, but
# that is a repo setting a future flip can widen silently — a permissions
# block is reviewable in the diff, which the setting is not.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dorny/paths-filter@v4.0.3
        id: filter
        with:
          filters: |
            code:
              - '**'
              - '!**/*.md'

  check:
    name: Check
    needs: [changes]
    # Gated: a markdown-only PR yields `code == false`, this is skipped, and
    # `ok` passes on skipped jobs. So anything that must hold for a DOCS-ONLY
    # change cannot live only here. `just check` runs `gen_docs.py --check`,
    # which polices hand-edits to generated doc blocks — exactly a docs-only
    # change — so `tests/test_docs.py::test_the_generated_doc_blocks_are_current`
    # runs it again from the ungated `test` job. Found in PR #156's review,
    # after this slice moved six checks out of `test` and into here.
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: extractions/setup-just@v4
      # Pinned to an exact version, not `@v9`: setup-uv STOPPED PUBLISHING major
      # and minor tags at v8.0.0, deliberately, as supply-chain hardening after
      # the tj-actions compromise. `astral-sh/setup-uv@v9` is a 404, so the
      # floating-major form every other action here uses would fail the job
      # outright. Bump the number; do not "tidy" it back to a major.
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - name: Setup
        run: just setup
      - name: Assert exactly one OCP provider
        run: just ocp-guard
      - name: Check (fmt + lint + typecheck)
        run: just check
      # The hooks are a second, separately-pinned copy of part of the toolchain
      # (ruff lives in `.pre-commit-config.yaml` as well as the dev group), and
      # gitleaks and the file fixers live ONLY there. Until this step they were
      # exercised nowhere but a developer's `git commit`.
      - name: Hooks
        run: just hooks

  test:
    name: Test (openscad ${{ matrix.openscad }})
    # Not gated on `changes`: the test suite asserts that the schema example in
    # docs/SPEC-report.md conforms to its own rules, so a docs-only change can
    # genuinely break it.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      # Two engines, because F13 is the finding that the same source builds a
      # *different part* on a different OpenSCAD — the gear library loses its
      # teeth on the newer one, both exiting 0 with clean watertight meshes.
      # Running one version would leave that a written-up anecdote; running
      # both makes it a standing guard. The pair also spans a real capability
      # boundary: `--backend` does not exist in 2021.01, which is what Debian
      # and Ubuntu ship.
      matrix:
        include:
          - openscad: "2021.01"
            source: apt
          - openscad: "2026.08.01"
            source: snapshot
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: extractions/setup-just@v4
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      # xvfb because 2021.01 has no EGL offscreen path: headless PNG rendering
      # segfaults without a display (#17). The snapshot leg needs no display,
      # which is itself part of what the matrix proves — and the mesh-only job
      # keeps NO xvfb on purpose, so the display-refusal branch runs in CI too.
      - name: Install OpenSCAD (apt)
        if: matrix.source == 'apt'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends openscad xvfb

      # Extracted rather than run in place: the runner image has no libfuse2,
      # so the AppImage cannot mount itself. Snapshots are pruned on a rolling
      # ~1-year window, so this URL will eventually 404 — which fails the job
      # loudly and is the point. A silently-skipped engine is what this whole
      # matrix exists to stop.
      - name: Install OpenSCAD (pinned snapshot)
        if: matrix.source == 'snapshot'
        run: |
          # The AppImage bundles Qt but not the graphics stack it links against,
          # and a bare runner has none of it — the binary will not even answer
          # `--version` without libEGL. This list is every NEEDED library the
          # extracted `usr/bin/openscad` resolves outside its own bundle and
          # that the image lacks; apt pulls the rest transitively. OpenSCAD
          # links these even to export an STL with no display attached.
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libopengl0 libgbm1 libwayland-client0 \
            libfontconfig1 libharfbuzz0b libgmp10
          url="https://files.openscad.org/snapshots/OpenSCAD-${{ matrix.openscad }}-x86_64.AppImage"
          # Downloaded and extracted OUTSIDE the checkout, because
          # `--appimage-extract` writes `squashfs-root/` into the CWD and that
          # is not build residue a repo can ignore: the AppImage bundles a whole
          # Python 3.10 stdlib, unignored, inside a tree every tool then walks.
          # `tests/test_lint_config.py` found it by running `ruff check .` and
          # reporting B011 findings from the AppImage's own `distutils`,
          # `doctest` and `threading` — on THIS leg only, which is why the apt
          # leg stayed green and the snapshot leg did not.
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 3 -o openscad.AppImage "$url"
          chmod +x openscad.AppImage
          ./openscad.AppImage --appimage-extract >/dev/null
          echo "PARTSPEC_OPENSCAD=$RUNNER_TEMP/squashfs-root/AppRun" >> "$GITHUB_ENV"

      # Without this the matrix can silently collapse to one version — apt
      # bumps its package and both legs quietly test the same engine while
      # still reporting two green checks.
      - name: Assert the engine is the one this leg declares
        run: |
          binary="${PARTSPEC_OPENSCAD:-openscad}"
          actual="$("$binary" --version 2>&1 | head -1)"
          echo "$actual"
          case "$actual" in
            *"${{ matrix.openscad }}"*) ;;
            *) echo "::error::expected OpenSCAD ${{ matrix.openscad }}, got: $actual"; exit 1 ;;
          esac

      - name: Setup
        run: just setup
      - name: Test
        env:
          PARTSPEC_REQUIRE_ENGINES: "1"
        run: ${{ matrix.source == 'apt' && 'xvfb-run -a just test' || 'just test' }}

      # The exemplar, through the CLI, on both engines. #290: `--expect` is
      # step 1 of AGENT-CONTRACT §1 and nothing this project ships ran it —
      # no `claims.lock` was tracked, and the examples were reached only
      # in-process by pytest, so the console contract an agent reads (the
      # exit code, and the difference named on stderr) was never gated.
      # Committing a lock that nothing exercises would reproduce that root
      # cause one layer down, which is why this step exists and not only the
      # file. It fails if `examples/spacer/spec.py` is edited without
      # `--pin`, which is exactly the confession the lock is committed for.
      - name: Exemplar claims pin (examples/spacer)
        env:
          PARTSPEC_REQUIRE_ENGINES: "1"
        run: ${{ matrix.source == 'apt' && 'xvfb-run -a just example-spacer' || 'just example-spacer' }}

      # The same suite, reversed. Order coupling is invisible to the forward
      # run by construction — a test that leaves process-global state behind
      # only breaks whatever sorts after it — and the forward order is the one
      # every developer and every other job already runs. One reversal exposes
      # the pairs, deterministically. It has caught a real one: an exemplar's
      # `claims.py` outliving its test and breaking the five tests that exist
      # to prove model modules do not cross directories.
      #
      # Only on one matrix leg: the coupling is a property of the Python
      # process, not of the OpenSCAD build.
      - name: Test (reverse file order)
        if: matrix.source == 'apt'
        env:
          PARTSPEC_REQUIRE_ENGINES: "1"
        run: xvfb-run -a just test-reverse

  # The mesh extra, alone, in a throwaway environment. `just setup` takes all
  # extras and scipy reaches the machine only via build123d/cadquery, so a
  # mesh-tier dependency on it passes every other job here and breaks everyone
  # who installed `partspec[mesh]`. This job is the only place that install
  # exists.
  #
  # It runs the WHOLE suite now, not just the mesh backend's own module. A
  # module gated on a proxy dependency — `numpy`, which arrives with trimesh —
  # collects in this environment and no other, so the narrow version left the
  # space between "no extras" and "all extras" uncovered. See the recipe.
  mesh-only:
    name: Mesh-only install
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: extractions/setup-just@v4
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - name: Install OpenSCAD (apt)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends openscad
      - name: Test
        # A subset: the *absence* of build123d and cadquery is what this job
        # proves, so requiring them would fail the honest run.
        env:
          PARTSPEC_REQUIRE_ENGINES: "openscad,trimesh,manifold3d"
        run: just test-mesh-only

  # The mcp extra, alone: the MCP adapter must stand up from `pip install
  # partspec[mcp]` with no CAD engine anywhere — it is core plus a subprocess
  # per call by design (D18), and this is the only job where that install
  # exists (#48).
  mcp-only:
    name: MCP-only install
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: extractions/setup-just@v4
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - name: Test
        run: just test-mcp-only

  # The two OCCT-tier extras, each alone. Neither environment existed in CI or
  # in any recipe until #170, and the reason was believed to be mechanical:
  # `uv pip install .[occt]` landed `cadquery-ocp-proxy` and NO `OCP` module,
  # so the `uv pip` shape every other job here uses appeared unable to build
  # them and they were carried on plain pip in a seeded venv instead. That was
  # #109, and it was ours — `uv pip` reads `[tool.uv]` from the pyproject.toml
  # above the CWD, so those installs inherited this repo's
  # `override-dependencies` and dropped novtk on purpose. Both recipes are
  # back on the ordinary `uv pip` shape with `--no-config`.
  #
  # `PARTSPEC_REQUIRE_ENGINES` is the sharp end. `conftest.py` resolves it by
  # IMPORTING the engine, not by `find_spec`, so these two jobs are the only
  # place in CI that can tell "the extra installed" apart from "the extra
  # works" — which is exactly the state #109 produced, and exactly the failure
  # that went unnoticed long enough to be written up as an upstream bug.
  #
  # Gated on `changes`, unlike `no-extras`: OCCT is ~1.5GB and these are the
  # slowest jobs in the file, so a docs-only PR should not pay for them.
  occt-only:
    name: OCCT-only install
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: extractions/setup-just@v4
      - uses: astral-sh/setup-uv@v10.0.1
      - name: Install OpenSCAD (apt)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends openscad
      - name: Test
        # The absence of trimesh and cadquery is what this job proves, so
        # requiring them would fail the honest run.
        env:
          PARTSPEC_REQUIRE_ENGINES: "openscad,build123d"
        run: just test-occt-only

  # The cadquery extra pulls build123d deliberately (`backends/occt.py`
  # measures through build123d's Shape API), so both are required here. What
  # this install ALSO lands is two OCP providers, and it cannot be made not to
  # — see the recipe. Running the suite in that state is how the two-provider
  # branch of `_engine_import_error` was found to be the only one with no test.
  cadquery-only:
    name: CadQuery-only install
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: extractions/setup-just@v4
      - uses: astral-sh/setup-uv@v10.0.1
      - name: Install OpenSCAD (apt)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends openscad
      - name: Test
        env:
          PARTSPEC_REQUIRE_ENGINES: "openscad,cadquery,build123d"
        run: just test-cadquery-only

  # No extras at all: the base install a `pip install partspec` produces.
  # `check` and `test` install every extra and `mesh-only`/`mcp-only` install a
  # subset, so this is the only job that can see a test whose engine dependency
  # is undeclared in a bare environment — it does not skip, it FAILS.
  # 23 did, and 392 more never collected, because a top-level `importorskip`
  # collapses its whole module to one skip line. Deliberately ungated by
  # `changes`: it is cheap, and the failure mode is invisible everywhere else.
  no-extras:
    name: No-extras install
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: extractions/setup-just@v4
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - name: Install OpenSCAD (apt)
        # The binary is a SYSTEM dependency, not an extra, so it belongs in the
        # base environment. Installing it is also what makes this job sharp:
        # with the binary present and the mesh extra absent, a scad-tier test
        # marked only `needs_openscad` runs and fails instead of skipping,
        # which is exactly the gap that shipped.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends openscad
      - name: Test
        run: just test-no-extras

  ok:
    name: ok
    if: always()
    needs: [changes, check, test, mesh-only, mcp-only, no-extras, occt-only, cadquery-only]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if any upstream job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - name: Pass
        run: echo 'All checks passed or were skipped'
